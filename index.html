<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Katana – Side Immersion</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* ── Scene wrapper ─────────────────────────────────────── */
    .scene {
      position: relative;
      width: min(420px, 100vw);
      height: min(747px, 100vh);
      overflow: hidden;
      border-radius: 4px;
    }

    /* ── Central image ─────────────────────────────────────── */
    .katana-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
    }

    /* ── Side vignette panels ──────────────────────────────── */
    .vignette {
      position: absolute;
      top: 0;
      width: 38%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    .vignette-left  { left:  0; background: linear-gradient(to right,  #0a0000 0%, rgba(10,0,0,.55) 60%, transparent 100%); }
    .vignette-right { right: 0; background: linear-gradient(to left,   #0a0000 0%, rgba(10,0,0,.55) 60%, transparent 100%); }

    /* ── Animated mist layer ───────────────────────────────── */
    .mist {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }
    .mist-band {
      position: absolute;
      width: 120%;
      height: 80px;
      background: radial-gradient(ellipse at center, rgba(200,60,60,.12) 0%, transparent 70%);
      border-radius: 50%;
      filter: blur(18px);
      animation: driftMist linear infinite;
    }

    @keyframes driftMist {
      0%   { transform: translateX(-60%) translateY(0)   scaleX(1);   opacity: 0; }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { transform: translateX(60%)  translateY(-30px) scaleX(1.3); opacity: 0; }
    }

    /* ── Particle canvas (leaves + embers) ─────────────────── */
    #particles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }

    /* ── Shimmer sword glow ────────────────────────────────── */
    .blade-glow {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 55%;
      background: linear-gradient(to top, rgba(255,255,255,.55) 0%, rgba(180,180,220,.15) 70%, transparent 100%);
      filter: blur(3px);
      z-index: 5;
      animation: bladeShimmer 3s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes bladeShimmer {
      0%, 100% { opacity: .55; filter: blur(3px); }
      50%       { opacity: 1;   filter: blur(1px) brightness(1.6); }
    }

    /* ── Corner embers ─────────────────────────────────────── */
    .ember-corner {
      position: absolute;
      width: 22%;
      height: 45%;
      z-index: 6;
      pointer-events: none;
      overflow: hidden;
    }
    .ember-corner.tl { top: 0; left:  0; }
    .ember-corner.tr { top: 0; right: 0; }
    .ember-corner.bl { bottom: 0; left:  0; }
    .ember-corner.br { bottom: 0; right: 0; }

    /* ── Deep-side streak lines ────────────────────────────── */
    .streaks {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 7;
      pointer-events: none;
    }
    .streak {
      position: absolute;
      width: 1px;
      background: linear-gradient(to bottom, transparent 0%, rgba(180,20,20,.4) 50%, transparent 100%);
      animation: streakFall linear infinite;
      opacity: 0;
    }
    @keyframes streakFall {
      0%   { transform: translateY(-100%); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(100%);  opacity: 0; }
    }

    /* ── Pulse ring on blade tip ───────────────────────────── */
    .pulse-ring {
      position: absolute;
      bottom: 2%;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 40px;
      border: 1px solid rgba(200,30,30,.7);
      border-radius: 50%;
      z-index: 8;
      animation: pulseRing 2.4s ease-out infinite;
      pointer-events: none;
    }
    @keyframes pulseRing {
      0%   { transform: translateX(-50%) scale(.5); opacity: .9; }
      100% { transform: translateX(-50%) scale(3);  opacity: 0;  }
    }
  </style>
</head>
<body>

<div class="scene" id="scene">

  <!-- Central image -->
  <img class="katana-img" src="katana.jpg" alt="Katana" id="katanaImg" />

  <!-- Depth vignettes -->
  <div class="vignette vignette-left"></div>
  <div class="vignette vignette-right"></div>

  <!-- Animated mist -->
  <div class="mist" id="mist"></div>

  <!-- Particle canvas -->
  <canvas id="particles"></canvas>

  <!-- Blade shimmer -->
  <div class="blade-glow"></div>

  <!-- Streak lines (side immersion) -->
  <div class="streaks" id="streaks"></div>

  <!-- Pulse ring -->
  <div class="pulse-ring"></div>
</div>

<script>
/* ── Helpers ──────────────────────────────────────────────── */
const rand = (a, b) => Math.random() * (b - a) + a;
const scene  = document.getElementById('scene');
const W = () => scene.offsetWidth;
const H = () => scene.offsetHeight;

/* ── Mist bands ───────────────────────────────────────────── */
(function buildMist() {
  const mist = document.getElementById('mist');
  for (let i = 0; i < 8; i++) {
    const b = document.createElement('div');
    b.className = 'mist-band';
    const top = rand(10, 90);
    const dur  = rand(12, 24);
    const del  = rand(0, dur);
    b.style.cssText = `top:${top}%;animation-duration:${dur}s;animation-delay:-${del}s;opacity:0;`;
    mist.appendChild(b);
  }
})();

/* ── Streak lines (left & right sides) ───────────────────── */
(function buildStreaks() {
  const container = document.getElementById('streaks');
  const sideW = 0.22; // 22% on each side
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('div');
    s.className = 'streak';
    const side = i < 10 ? 'left' : 'right';
    const pct  = side === 'left' ? rand(0, sideW * 100) : rand((1 - sideW) * 100, 100);
    const h    = rand(30, 70);
    const dur  = rand(3, 7);
    const del  = rand(0, dur);
    s.style.cssText = `left:${pct}%;height:${h}%;animation-duration:${dur}s;animation-delay:-${del}s;`;
    container.appendChild(s);
  }
})();

/* ── Particles (maple leaves + embers) ────────────────────── */
(function particles() {
  const canvas = document.getElementById('particles');
  const ctx    = canvas.getContext('2d');

  function resize() {
    canvas.width  = scene.offsetWidth;
    canvas.height = scene.offsetHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  /* Maple leaf shape (tiny path) */
  function drawLeaf(ctx, x, y, size, angle, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    // simple 5-point star-ish leaf silhouette
    for (let i = 0; i < 5; i++) {
      const a1 = (i * 2 * Math.PI / 5) - Math.PI / 2;
      const a2 = a1 + Math.PI / 5;
      ctx.lineTo(Math.cos(a1) * size, Math.sin(a1) * size);
      ctx.lineTo(Math.cos(a2) * size * .45, Math.sin(a2) * size * .45);
    }
    ctx.closePath();
    const hue = rand(0, 20);
    ctx.fillStyle = `hsl(${hue},90%,${rand(28,46)}%)`;
    ctx.fill();
    ctx.restore();
  }

  /* Ember dot */
  function drawEmber(ctx, x, y, r, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,200,80,1)');
    g.addColorStop(1, 'rgba(200,30,10,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  /* Particle pool – spawn only on left/right strips */
  const SIDE = 0.28;
  const particles = [];

  function spawnParticle() {
    const side = Math.random() < .5 ? 'left' : 'right';
    const x = side === 'left'
      ? rand(0, W() * SIDE)
      : rand(W() * (1 - SIDE), W());
    return {
      x,
      y: rand(-20, H() * .3),
      vx: rand(-0.4, 0.4) + (side === 'left' ? 0.2 : -0.2),
      vy: rand(0.6, 1.8),
      spin: rand(-0.04, 0.04),
      angle: rand(0, Math.PI * 2),
      size: rand(4, 11),
      life: 1,
      decay: rand(0.003, 0.008),
      type: Math.random() < .65 ? 'leaf' : 'ember',
    };
  }

  for (let i = 0; i < 35; i++) {
    const p = spawnParticle();
    p.y = rand(0, H()); // distribute vertically on init
    particles.push(p);
  }

  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    /* Spawn new particles as old ones die */
    while (particles.length < 45) particles.push(spawnParticle());

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x     += p.vx;
      p.y     += p.vy;
      p.angle += p.spin;
      p.life  -= p.decay;

      if (p.life <= 0 || p.y > H() + 20) {
        particles.splice(i, 1);
        continue;
      }

      if (p.type === 'leaf') {
        drawLeaf(ctx, p.x, p.y, p.size, p.angle, p.life * .85);
      } else {
        drawEmber(ctx, p.x, p.y, p.size * .5, p.life);
      }
    }

    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
</body>
</html>
